<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BMO</title>
    <link rel="stylesheet" href="stylesheets/style.css" />
    <script defer src="vendor/Tone.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body>
    <main id="instrument" aria-label="BMO Music Instrument">
      <!-- Корпус, руки, подписи и отдельные SVG-изображения -->
      <div class="artwork" aria-hidden="true">
        <div class="art-item art-bmo-on-the-left-1">
          <img class="art-image" src="img/interface/BMO-on-the-left.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-bmo-on-the-right-1">
          <img
            class="art-image"
            src="img/interface/BMO-on-the-right.svg"
            alt=""
            draggable="false"
          />
        </div>
        <div class="art-item art-poits-1">
          <img class="art-image" src="img/interface/poits.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-poits-2">
          <img class="art-image" src="img/interface/poits.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-body-1">
          <img class="art-image" src="img/interface/body.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-face-screen-1">
          <img class="art-image" src="img/interface/face- screen.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-left-hand-1">
          <img class="art-image" src="img/interface/left-hand.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-rignt-hand-1">
          <img class="art-image" src="img/interface/rignt-hand.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-attack-1">
          <img class="art-image" src="img/interface/attack.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-sustain-1">
          <img class="art-image" src="img/interface/sustain.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-attack-2">
          <img class="art-image" src="img/interface/attack.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-relaese-1">
          <img class="art-image" src="img/interface/relaese.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-wave-type-1">
          <img class="art-image" src="img/interface/wave-type.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-wave-type-2">
          <img class="art-image" src="img/interface/wave-type.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-sine-1">
          <img class="art-image" src="img/interface/sine.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-pulse-1">
          <img class="art-image" src="img/interface/pulse.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-square-1">
          <img class="art-image" src="img/interface/square.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-triangle-1">
          <img class="art-image" src="img/interface/triangle.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-delay-1">
          <img class="art-image" src="img/interface/delay.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-chorus-1">
          <img class="art-image" src="img/interface/chorus.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-delay-2">
          <img class="art-image" src="img/interface/delay.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-chorus-2">
          <img class="art-image" src="img/interface/chorus.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-stop-1">
          <img class="art-image" src="img/interface/stop.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-blue-button-1 button-art" id="wave-a-sine-art">
          <img class="art-image" src="img/interface/blue-button.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-blue-button-2 button-art" id="wave-a-pulse-art">
          <img class="art-image" src="img/interface/blue-button.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-blue-button-3 button-art" id="wave-b-square-art">
          <img class="art-image" src="img/interface/blue-button.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-blue-button-4 button-art" id="wave-b-triangle-art">
          <img class="art-image" src="img/interface/blue-button.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-light-blue-triangle-1 launch-art" id="launch-right-art">
          <img
            class="art-image"
            src="img/interface/light-blue- triangle.svg"
            alt=""
            draggable="false"
          />
        </div>
        <div class="art-item art-circle-blue-1 button-art" id="stop-art">
          <img class="art-image" src="img/interface/circle-blue.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-circle-pink-1">
          <img class="art-image" src="img/interface/circle-pink.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-circle-pink-2">
          <img class="art-image" src="img/interface/circle-pink.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-circle-green-1">
          <img class="art-image" src="img/interface/circle-green.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-circle-green-2">
          <img class="art-image" src="img/interface/circle-green.svg" alt="" draggable="false" />
        </div>
        <div class="art-item art-yellow-1 launch-art" id="launch-left-art">
          <img class="art-image" src="img/interface/yellow.svg" alt="" draggable="false" />
        </div>
      </div>
      <div id="controls">
        <!-- Левый голос: кнопки и регуляторы -->
        <div class="voice-controls" role="group" aria-label="Star Melody">
          <input
            class="control slider a-attack"
            type="range"
            data-voice="a"
            data-param="attack"
            min="0"
            max="2"
            step="0.001"
            value="0.05"
            aria-label="Star Melody attack"
          />
          <input
            class="control slider a-sustain"
            type="range"
            data-voice="a"
            data-param="sustain"
            min="0"
            max="1"
            step="0.001"
            value="0.6"
            aria-label="Star Melody sustain"
          />
          <button
            class="control wave a-sine"
            type="button"
            data-voice="a"
            data-wave="sine"
            aria-label="Star Melody: sine"
            aria-pressed="false"
          ></button>
          <button
            class="control wave a-pulse"
            type="button"
            data-voice="a"
            data-wave="pulse"
            aria-label="Star Melody: pulse"
            aria-pressed="false"
          ></button>
          <div
            class="control knob a-delay"
            data-voice="a"
            data-param="delay"
            role="slider"
            tabindex="0"
            aria-label="Star Melody delay"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span class="dot"></span>
          </div>
          <div
            class="control knob a-chorus"
            data-voice="a"
            data-param="chorus"
            role="slider"
            tabindex="0"
            aria-label="Star Melody chorus"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span class="dot"></span>
          </div>
          <button
            id="launch-left"
            class="control note launch-left"
            type="button"
            aria-label="Плюс — запустить левый голос"
            aria-pressed="false"
          ></button>
        </div>
        <!-- Правый голос: кнопки и регуляторы -->
        <div class="voice-controls" role="group" aria-label="Bubble Bass">
          <input
            class="control slider b-attack"
            type="range"
            data-voice="b"
            data-param="attack"
            min="0"
            max="2"
            step="0.001"
            value="0.01"
            aria-label="Bubble Bass attack"
          />
          <input
            class="control slider b-release"
            type="range"
            data-voice="b"
            data-param="release"
            min="0"
            max="3"
            step="0.001"
            value="0.25"
            aria-label="Bubble Bass release"
          />
          <button
            class="control wave b-square"
            type="button"
            data-voice="b"
            data-wave="square"
            aria-label="Bubble Bass: square"
            aria-pressed="false"
          ></button>
          <button
            class="control wave b-triangle"
            type="button"
            data-voice="b"
            data-wave="triangle"
            aria-label="Bubble Bass: triangle"
            aria-pressed="false"
          ></button>
          <div
            class="control knob b-delay"
            data-voice="b"
            data-param="delay"
            role="slider"
            tabindex="0"
            aria-label="Bubble Bass delay"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span class="dot"></span>
          </div>
          <div
            class="control knob b-chorus"
            data-voice="b"
            data-param="chorus"
            role="slider"
            tabindex="0"
            aria-label="Bubble Bass chorus"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <span class="dot"></span>
          </div>
          <button
            id="launch-right"
            class="control play launch-right"
            type="button"
            aria-label="Треугольник — запустить правый голос"
            aria-pressed="false"
          ></button>
          <button
            id="stop-button"
            class="control stop-button"
            type="button"
            aria-label="Stop — остановить оба голоса"
          ></button>
        </div>
      </div>
      <div id="live" class="sr-only" role="status"></div>
    </main>
  </body>
</html>
